name: Android APK release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'situations/**'
      - 'jurisdictions/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync Android project
        run: npm run android:sync

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" diario-rumore.apk
          sha256sum diario-rumore.apk | tee diario-rumore.apk.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHECKSUM=$(cut -d ' ' -f 1 diario-rumore.apk.sha256)
          cat > release-notes.md <<EOF
          APK Android di Diario Rumore, versione ${VERSION_NAME}, generato dal commit ${GITHUB_SHA}.

          - Accedi con lo stesso account del sito: episodi e audio sono condivisi tramite il cloud.
          - Serve una connessione Internet; le modifiche offline non vengono accodate.
          - Gli aggiornamenti sono firmati con la stessa chiave: installa il nuovo APK sopra quello esistente.

          SHA-256 dell'APK: \`${CHECKSUM}\`

          Istruzioni: [docs/android-app.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/android-app.md)
          EOF
          gh release create "android-v${VERSION_NAME}" diario-rumore.apk diario-rumore.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Diario Rumore Android ${VERSION_NAME}" \
            --notes-file release-notes.md \
            --latest

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
