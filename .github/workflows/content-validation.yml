name: Content and application validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: content-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content, links, metadata, placeholders, and privacy indicators
        run: npm run content:check

      - name: Check Markdown and YAML formatting
        run: npm run lint

      - name: Run application tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run e2e

      - name: Build production application
        run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync Android project
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
