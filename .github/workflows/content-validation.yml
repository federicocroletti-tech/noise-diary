name: Content and application validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: content-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content, links, metadata, placeholders, and privacy indicators
        run: npm run content:check

      - name: Check Markdown and YAML formatting
        run: npm run lint

      - name: Run application tests
        run: npm test

      - name: Build production application
        run: npm run build
