name: Proposta o correzione di contenuto
description: Proponi una guida o una revisione verificabile senza dati personali.
title: '[Contenuto] '
labels:
  - content
body:
  - type: input
    id: situation
    attributes:
      label: Situazione e percorso
      placeholder: situations/noise/
    validations:
      required: true
  - type: input
    id: jurisdiction
    attributes:
      label: Paese o territorio
      placeholder: Globale organizzativo oppure Paese/territorio specifico
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta, problema e rischio
      description: Non inserire casi reali, dati personali, allegati o dettagli identificativi.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Fonti ufficiali e data di verifica
      description: Per contenuti normativi o amministrativi, indica fonte primaria, URL ufficiale e data.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy e diritti
      options:
        - label: Ho escluso dati personali e materiali di terzi non autorizzati.
          required: true
