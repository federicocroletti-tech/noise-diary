name: Segnalazione problema
description: Segnala un problema riproducibile senza condividere dati personali.
title: '[Bug] '
labels:
  - bug
body:
  - type: textarea
    id: expected
    attributes:
      label: Risultato atteso e risultato osservato
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passaggi per riprodurre
      description: Usa dati sintetici. Non allegare registrazioni o documenti reali.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser e sistema operativo
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Conferma
      options:
        - label: Ho rimosso dati personali, identificativi e file originali.
          required: true
